---
layout: default
title: Blogs
---

<section class="blog-grid">
  {% for post in site.posts %}
    <div class="blog-card">
      <div class="blog-content">
        <h3>{{ post.title }}</h3>
        <p class="blog-excerpt">{{ post.excerpt }}</p>
        <a href="{{ post.url }}" class="read-more">Read →</a>
      </div>
    </div>
    <div class="post-card">
  
      {% if post.cover %}
        <img class="post-card-img" src="{{ post.cover }}" alt="{{ post.title }}">
      {% endif %}
  
      <h2>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </h2>
  
      <p>{{ post.excerpt }}</p>
    </div>
  {% endfor %}
</section>
