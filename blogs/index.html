---
layout: null
---
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Blogs | Saurabh Borse</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

{% include nav.html %}

<section style="margin-top:6rem;">
  <h2 class="section-title">Blogs</h2>

  <div class="blog-grid">
    {% for post in site.posts %}
    <div class="blog-card" onclick="window.location.href='{{ post.url }}'">
      <div class="blog-image">{{ post.emoji | default: "📘" }}</div>
      <div class="blog-content">
        <h3>{{ post.title }}</h3>
        <p class="blog-meta">{{ post.date | date: "%d %b %Y" }}</p>
        <p class="blog-excerpt">
          {{ post.excerpt | strip_html | truncate: 140 }}
        </p>
      </div>
    </div>
    {% endfor %}
  </div>
</section>

{% include footer.html %}

</body>
</html>
